spring.application.name=cupcakes-app
# A hospedagem informa a porta pela variável PORT; localmente fica 8080
server.port=${PORT:8080}

# --- Banco de dados (HeidiSQL / MySQL) ---------------------------------
# Defina DB_USER e DB_PASSWORD como variáveis de ambiente, ou troque aqui.
# Local: usa o MySQL da sua máquina. Na hospedagem, defina a variável DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/cupcakes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# "update" cria/ajusta tabelas que faltarem. O modelo oficial está em sql/01_schema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

# --- Regras de negócio configuráveis ------------------------------------
# HU-08 RN#1: a loja atende só as regiões configuradas (prefixos de CEP, separados por vírgula)
loja.frete.prefixos=387
loja.frete.valor=12.00
# HU-08 RN#2: frete grátis para pedidos ACIMA deste valor
loja.frete.gratis-acima=150.00
loja.frete.prazo-dias=2

# Administrador criado automaticamente na primeira execução
loja.admin.email=admin@cupcakes.com
loja.admin.senha=Admin@123

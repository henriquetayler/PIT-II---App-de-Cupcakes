<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeca('Entrar')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main class="estreito">
    <h1>Entrar</h1>
    <div th:replace="~{fragments :: mensagens}"></div>

    <form th:action="@{/login}" method="post" class="form">
        <label>E-mail
            <input type="email" name="email" th:value="${email}" required autofocus>
        </label>
        <label>Senha
            <input type="password" name="senha" required>
        </label>
        <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
</main>
</body>
</html>
